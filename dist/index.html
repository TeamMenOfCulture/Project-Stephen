<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Write words using your eye movements. Built with Tensorflow.js">
    <meta property="og:description" content="Write words using your eye movements. Built with Tensorflow.js">
    <meta property="twitter:description" content="Write words using your eye movements. Built with Tensorflow.js">
    <meta property="og:image"
        content="https://res.cloudinary.com/devdevcharlie/image/upload/v1612225468/Screenshot_2021-02-02_at_01.18.18_dcpjpo.png">
    <meta property="og:url" content="https://gaze-keyboard.netlify.app">
    <meta name="twitter:card" content="summary_large_image">
    <title>Gaze-controlled keyboard</title>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.64474a6f.css">
</head>

<body>
    <h1>Project Stephen</h1>
    <section class="info">
        <div class="instruction"> Look left or right to filter down the letter/command you would like to select. </div>
        <div class="model-status">Machine learning model loading...</div>
    </section>
    <main style="display: flex;flex-direction: column;">
        <div class="AIgenPanel">
            <!-- <label for="prompt">Enter your prompt:</label> -->
            <!-- <input type="text" class="prompt" id="prompt" name="prompt"> -->
            <p class="prompt" id="prompt"></p>
            <button class="genButton">Generate</button>

        </div>
        <div class="SpeechToText">
            <div class="texts"></div>
            <button id="btn1">Start Speech Recognition</button>
            <button id="btn2">Stop Speech Recognition</button>
          </div>
        <div id="main"> <video id="video" playsinline=""
                style="-webkit-transform:scaleX(-1);transform:scaleX(-1);visibility:hidden;width:auto;height:auto;display:none;"></video>
            <section class="keyboard"> <textarea class="output" placeholder="Type a message with your eyes..." cols="30"
                    rows="1"></textarea>
                <section class="letters">
                    <section class="section-left"></section>
                    <section class="section-right"></section>
                </section>
            </section>
        </div>
    </main>
    <script src="keyboard.42f64f1b.js"></script>
    <script>
        // Your JavaScript code goes here
        const promptContainer = document.querySelector(".prompt");
        const button1 = document.querySelector("#btn1");
        const button2 = document.querySelector("#btn2");

        window.SpeechRecognition =
            window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.interimResults = true;

        recognition.addEventListener("result", (e) => {
            const text = Array.from(e.results)
                .map((result) => result[0])
                .map((result) => result.transcript)
                .join("");

            // Update the content of the promptContainer with the spoken text
            promptContainer.textContent = text;
        });

        recognition.start();
    </script>
</body>

</html>
