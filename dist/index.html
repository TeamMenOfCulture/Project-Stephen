<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Write words using your eye movements. Built with Tensorflow.js"
    />
    <meta
      property="og:description"
      content="Write words using your eye movements. Built with Tensorflow.js"
    />
    <meta
      property="twitter:description"
      content="Write words using your eye movements. Built with Tensorflow.js"
    />
    <meta
      property="og:image"
      content="https://res.cloudinary.com/devdevcharlie/image/upload/v1612225468/Screenshot_2021-02-02_at_01.18.18_dcpjpo.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Project Stephen</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.64474a6f.css" />
  </head>

  <body>
    <h1>Project <span id="title">Stephen</span></h1>
    <section class="info">
      <div class="instruction">
        Look left or right to filter down the letter/command you would like to
        select.
      </div>
      <div class="model-status">Machine learning model loading...</div>
    </section>
    <main style="display: flex; flex-direction: column">
      <p class="prompt" id="prompt"></p>
      <div class="AIgenPanel" style="display: none">
        <!-- <label for="prompt">Enter your prompt:</label> -->
        <!-- <input type="text" class="prompt" id="prompt" name="prompt"> -->
        <button class="genButton">Generate</button>

        <!-- <span id="answer">Generated content will appear here</span>
            <span id="answer1"></span>
            <span id="answer2"></span>
            <span id="answer3"></span> -->
      </div>
      <div class="texts"></div>
      <!-- <div class="SpeechToText">
        <button id="btn1">Start Speech Recognition</button>
        <button id="btn2">Stop Speech Recognition</button>
      </div> -->
      <div id="main">
        <video
          id="video"
          playsinline=""
          style="
            -webkit-transform: scaleX(-1);
            transform: scaleX(-1);
            visibility: visible;
            width: auto;
            height: auto;
            display: none;
          "
        ></video>
        <section class="keyboard">
          <textarea
            class="output"
            placeholder="Type a message with your eyes..."
            cols="30"
            rows="1"
            style="border-radius: 10px 10px 0px 0px"
          ></textarea>
          <section class="letters">
            <section
              class="section-left"
              style="border-radius: 0 0 0 10px"
            ></section>
            <section
              class="section-right"
              style="border-radius: 0 0 10px 0"
            ></section>
          </section>
        </section>
      </div>
      <form>
        <select id="voiceSelect"></select>
        <input id="voiceInput" value="Chris made me say it!" style="display: none;"/>
        <button type="submit" id="speakButton" style="visibility: hidden;">Speak</button>
      </form>
    </main>
    <script src="keyboard.42f64f1b.js"></script>
    <script></script>
  </body>
</html>
